
name: Android Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pure-Java core of the OpenVPN payload / WebSocket transport: compile + run its tests before building.
      - name: Test OpenVPN transport core
        run: |
          mkdir -p /tmp/ovpn-core
          javac -Xlint:all -d /tmp/ovpn-core app/src/main/java/com/ontunnel/app/ovpn/*.java tools/ovpn-core-test/*.java
          java -cp /tmp/ovpn-core PayloadScenarios
          java -cp /tmp/ovpn-core OvpnCoreTest

      - name: Restore fixed Debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: on-tunnel-debug-keystore-v1

      - name: Create Debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ON Tunnel Debug,O=ON Tunnel,C=US"
          fi

      - name: Set up Go for DNSTT core
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build DNSTT Android library (ARMv7 + ARM64)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.2.0 https://github.com/dnstt-xyz/dnstt_xyz_app.git /tmp/dnstt-upstream
          cd /tmp/dnstt-upstream/go_src
          # Expose the dynamically assigned local listener port to the Android SSH bridge.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mobile/mobile.go")
          s = p.read_text()
          marker = "// IsRunning returns whether the client is running"
          method = """// LocalPort returns the TCP port used by the local tunnel listener.
          func (c *DnsttClient) LocalPort() int {
          	c.mu.Lock()
          	defer c.mu.Unlock()
          	if c.listener == nil {
          		return 0
          	}
          	addr, ok := c.listener.Addr().(*net.TCPAddr)
          	if !ok {
          		return 0
          	}
          	return addr.Port
          }

          """
          if marker not in s:
              raise SystemExit("DNSTT source layout changed: LocalPort insertion point not found")
          p.write_text(s.replace(marker, method + marker, 1))
          PY
          cat > mobile/resolver_transport.go <<'GO'
          package mobile
          import (
           "context"
           "crypto/tls"
           "encoding/binary"
           "fmt"
           "io"
           "net"
           "net/http"
           "net/url"
           "strconv"
           "strings"
           "sync"
           "syscall"
           "time"
          )
          type resolverAddr string
          func (a resolverAddr) Network() string { return "dns" }
          func (a resolverAddr) String() string { return string(a) }
          type resolverPacketConn struct {
           mu sync.Mutex
           closed bool
           results chan []byte
          done chan struct{}
           mode, endpoint, serverName string
           client *http.Client
           dialer net.Dialer
           deadline time.Time
          }
          func makeProtectedDialer(protect ProtectSocketFunc) net.Dialer {
           d:=net.Dialer{Timeout:12*time.Second}
           if protect!=nil { d.Control=func(_, _ string, raw syscall.RawConn) error {
            var pe error
            e:=raw.Control(func(fd uintptr){if !protect(int(fd)){pe=fmt.Errorf("failed to protect DNS resolver socket")}})
            if e!=nil{return e}; return pe
           }}
           return d
          }
          func newResolverPacketConn(resolver string, protect ProtectSocketFunc)(net.PacketConn,net.Addr,error){
           resolver=strings.TrimSpace(resolver)
           if strings.HasPrefix(strings.ToLower(resolver),"https://"){
            u,e:=url.Parse(resolver); if e!=nil||u.Host==""||u.Path==""||u.Path=="/"{return nil,nil,fmt.Errorf("invalid DoH URL; include /dns-query")}
            d:=makeProtectedDialer(protect)
            tr:=&http.Transport{Proxy:nil,DialContext:d.DialContext,TLSClientConfig:&tls.Config{MinVersion:tls.VersionTLS12},ForceAttemptHTTP2:true}
            c:=&resolverPacketConn{mode:"doh",endpoint:u.String(),results:make(chan []byte,32),done:make(chan struct{}),dialer:d,client:&http.Client{Transport:tr,Timeout:12*time.Second}}
            return c,resolverAddr(u.Host),nil
           }
           if strings.HasPrefix(strings.ToLower(resolver),"tls://")||strings.HasPrefix(strings.ToLower(resolver),"dot://"){
            target:=resolver[strings.Index(resolver,"://")+3:]
            host,port,e:=net.SplitHostPort(target)
            if e!=nil { if strings.Contains(e.Error(),"missing port in address"){host,port=target,"853"}else{return nil,nil,fmt.Errorf("invalid DoT address: %v",e)}}
            if host==""{return nil,nil,fmt.Errorf("DoT hostname missing")}
            if _,e=strconv.Atoi(port);e!=nil{return nil,nil,fmt.Errorf("invalid DoT port")}
            d:=makeProtectedDialer(protect)
            c:=&resolverPacketConn{mode:"dot",endpoint:net.JoinHostPort(host,port),serverName:host,results:make(chan []byte,32),done:make(chan struct{}),dialer:d}
            return c,resolverAddr(c.endpoint),nil
           }
           addr:=resolver
           if _,_,e:=net.SplitHostPort(addr);e!=nil {if strings.Contains(e.Error(),"missing port in address"){addr=net.JoinHostPort(addr,"53")}else{return nil,nil,fmt.Errorf("invalid UDP DNS address: %v",e)}}
           remote,e:=net.ResolveUDPAddr("udp",addr);if e!=nil{return nil,nil,fmt.Errorf("failed to resolve DNS server: %v",e)}
           pc,e:=net.ListenUDP("udp4",&net.UDPAddr{IP:net.IPv4zero,Port:0});if e!=nil{return nil,nil,e}
           if protect!=nil {raw,e:=pc.SyscallConn();if e!=nil{pc.Close();return nil,nil,e};var pe error;e=raw.Control(func(fd uintptr){if !protect(int(fd)){pe=fmt.Errorf("failed to protect DNS resolver socket")}});if e!=nil{pc.Close();return nil,nil,e};if pe!=nil{pc.Close();return nil,nil,pe}}
           return pc,remote,nil
          }
          func(c *resolverPacketConn) WriteTo(p []byte,_ net.Addr)(int,error){
           c.mu.Lock();if c.closed{c.mu.Unlock();return 0,net.ErrClosed};deadline:=c.deadline;c.mu.Unlock()
           ctx:=context.Background();cancel:=func(){}
           if !deadline.IsZero(){ctx,cancel=context.WithDeadline(ctx,deadline)}else{ctx,cancel=context.WithTimeout(ctx,12*time.Second)};defer cancel()
           var answer []byte
           if c.mode=="doh"{
            req,e:=http.NewRequestWithContext(ctx,http.MethodPost,c.endpoint,strings.NewReader(string(p)));if e!=nil{return 0,e}
            req.Header.Set("Content-Type","application/dns-message");req.Header.Set("Accept","application/dns-message")
            resp,e:=c.client.Do(req);if e!=nil{return 0,fmt.Errorf("DoH query failed: %w",e)};defer resp.Body.Close()
            if resp.StatusCode!=http.StatusOK{return 0,fmt.Errorf("DoH HTTP status %d",resp.StatusCode)}
            answer,e=io.ReadAll(io.LimitReader(resp.Body,65536));if e!=nil{return 0,e}
           }else{
            conn,e:=tls.DialWithDialer(&c.dialer,"tcp",c.endpoint,&tls.Config{ServerName:c.serverName,MinVersion:tls.VersionTLS12});if e!=nil{return 0,fmt.Errorf("DoT connection failed: %w",e)};defer conn.Close()
            if deadline.IsZero(){conn.SetDeadline(time.Now().Add(12*time.Second))}else{conn.SetDeadline(deadline)}
            if len(p)>65535{return 0,fmt.Errorf("DNS packet too large")}
            var h [2]byte;binary.BigEndian.PutUint16(h[:],uint16(len(p)))
            if _,e=conn.Write(append(h[:],p...));e!=nil{return 0,e}
            if _,e=io.ReadFull(conn,h[:]);e!=nil{return 0,e};answer=make([]byte,int(binary.BigEndian.Uint16(h[:])))
            if _,e=io.ReadFull(conn,answer);e!=nil{return 0,e}
           }
           select{case c.results<-answer:return len(p),nil;case <-c.done:return 0,net.ErrClosed;case <-ctx.Done():return 0,ctx.Err()}
          }
          func(c *resolverPacketConn) ReadFrom(p []byte)(int,net.Addr,error){
           c.mu.Lock();closed:=c.closed;deadline:=c.deadline;c.mu.Unlock();if closed{return 0,nil,net.ErrClosed}
           if deadline.IsZero(){select{case b:=<-c.results:return copy(p,b),resolverAddr(c.endpoint),nil;case <-c.done:return 0,nil,net.ErrClosed}}
           d:=time.Until(deadline);if d<=0{return 0,nil,timeoutError{}}
           t:=time.NewTimer(d);defer t.Stop();select{case b:=<-c.results:return copy(p,b),resolverAddr(c.endpoint),nil;case <-c.done:return 0,nil,net.ErrClosed;case <-t.C:return 0,nil,timeoutError{}}
          }
          type timeoutError struct{}
          func(timeoutError)Error()string{return "i/o timeout"}
          func(timeoutError)Timeout()bool{return true}
          func(timeoutError)Temporary()bool{return true}
          func(c *resolverPacketConn)Close()error{c.mu.Lock();defer c.mu.Unlock();if !c.closed{c.closed=true;close(c.done);if c.client!=nil{c.client.CloseIdleConnections()}};return nil}
          func(c *resolverPacketConn)LocalAddr()net.Addr{return resolverAddr("local-dns")}
          func(c *resolverPacketConn)SetDeadline(t time.Time)error{c.mu.Lock();c.deadline=t;c.mu.Unlock();return nil}
          func(c *resolverPacketConn)SetReadDeadline(t time.Time)error{return c.SetDeadline(t)}
          func(c *resolverPacketConn)SetWriteDeadline(t time.Time)error{return c.SetDeadline(t)}
          GO
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mobile/mobile.go"); s=p.read_text()
          import re
          pattern = re.compile(r"\t// Resolve DNS server address.*?\n\tc\.conn = pconn", re.S)
          replacement = "\t// Select native UDP, DNS-over-HTTPS, or DNS-over-TLS.\n\tpconn, remoteAddr, err := newResolverPacketConn(c.dnsAddr, c.protectSocket)\n\tif err != nil { return err }\n\tc.conn = pconn"
          s, count = pattern.subn(lambda _: replacement, s, count=1)
          if count != 1: raise SystemExit("Could not replace upstream UDP resolver block; refusing build patch")

          p.write_text(s)
          PY
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$sdkmanager" --licenses || true
          "$sdkmanager" "ndk;27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260112195712-5b9ecdfb8721
          gomobile init
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          GOFLAGS="-trimpath" gomobile bind -v -androidapi 24 -target=android/arm,android/arm64 -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/libs/dnstt.aar" ./mobile
          test -s "$GITHUB_WORKSPACE/app/libs/dnstt.aar"

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar" \
            -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          yes | "$sdkmanager" --licenses || true
          "$sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clean and build ARM APKs
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Verify APK files and architectures
        shell: bash
        run: |
          set -euo pipefail

          universal="app/build/outputs/apk/debug/app-universal-debug.apk"

          if [ ! -f "$universal" ]; then
            echo "::error::Universal APK was not generated."
            ls -lah app/build/outputs/apk/debug/
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -t "$universal"

          echo "Checking ARM architectures..."
          entries="$(unzip -Z1 "$universal")"

          if ! grep -q '^lib/arm64-v8a/.*\.so$' <<< "$entries"; then
            echo "::error::arm64-v8a libraries are missing."
            exit 1
          fi

          if ! grep -q '^lib/armeabi-v7a/.*\.so$' <<< "$entries"; then
            echo "::error::armeabi-v7a libraries are missing."
            exit 1
          fi

          if grep -Eq '^lib/(x86|x86_64)/' <<< "$entries"; then
            echo "::error::Unexpected x86 libraries found."
            exit 1
          fi

          echo "Universal APK contains both ARM architectures."

      - name: Verify signatures
        shell: bash
        run: |
          set -euo pipefail

          expected="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          count=0

          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue

            echo "Checking: $apk"

            unzip -t "$apk" >/dev/null

            output="$("$apksigner" verify --print-certs "$apk")"
            echo "$output"

            actual="$(echo "$output" |
              awk '/certificate SHA-256 digest:/ {print $NF; exit}' |
              tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Invalid APK signature."
              exit 1
            fi

            count=$((count + 1))
          done

          test "$count" -gt 0
          echo "All APK files passed verification."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-ARM
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p release

          cp app/build/outputs/apk/debug/app-universal-debug.apk \
             release/ON-Tunnel-Universal.apk

          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             release/ON-Tunnel-arm64-v8a.apk

          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             release/ON-Tunnel-armeabi-v7a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ON Tunnel ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
