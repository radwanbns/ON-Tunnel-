name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Development / smoke-test build ONLY – signed with the shared debug
  # keystore and android:debuggable=true. Never distribute this artifact to
  # end users; it is intentionally far easier to patch (adb run-as, JDWP
  # debugger attach, generic smali-patching tools) than the release build
  # below. Kept here only so pushes/PRs get a quick compile check.
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Reuse the same debug signing key between workflow runs.
      - name: Restore fixed Debug keystore
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: on-tunnel-debug-keystore-v1

      - name: Create Debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ON Tunnel Debug,O=ON Tunnel,C=US"
          fi

      - name: Show fixed signing certificate
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep "SHA256:"

      - name: Download pinned Xray core
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar" \
            -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build all ABI APKs with the fixed signing key
        run: gradle assembleDebug --no-daemon

      - name: Verify the signature of every APK
        shell: bash
        run: |
          set -euo pipefail
          expected="$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$expected"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          count=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            test -f "$apk"
            echo "=== $(basename "$apk") ==="
            cert_output="$("$apksigner" verify --print-certs "$apk")"
            echo "$cert_output"
            actual="$(printf '%s\\n' "$cert_output" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            echo "APK certificate SHA-256: $actual"
            if [ -z "$actual" ]; then
              echo "::error::Could not extract APK signing certificate SHA-256."
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::APK signing certificate does not match the fixed Debug keystore."
              exit 1
            fi
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "All $count APK files use the same fixed signing certificate."

      - name: Upload all ABI APKs (debug / dev only)
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-debug-DO-NOT-DISTRIBUTE
          path: app/build/outputs/apk/debug/*.apk

  # Real release build – what should actually be distributed to users.
  # Requires three repo secrets to be configured first (Settings > Secrets
  # and variables > Actions):
  #   RELEASE_KEYSTORE_BASE64   – `base64 -w0 your-release.jks`
  #   RELEASE_STORE_PASSWORD
  #   RELEASE_KEY_PASSWORD
  # (the key alias is fixed below as "ontunnel-release" – change it if yours differs)
  # Until those secrets exist this job builds an UNSIGNED release APK (still
  # minified/obfuscated/non-debuggable) so the pipeline doesn't silently
  # fall back to the weak debug key.
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore (if configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set – building an UNSIGNED release APK."
          fi

      - name: Download pinned Xray core
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar" \
            -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build all ABI APKs (release)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ontunnel-release
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify release APKs are signed, non-debuggable and match the pinned certificate
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt2="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$apksigner"

          count=0
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            echo "=== $(basename "$apk") ==="
            "$apksigner" verify --print-certs "$apk" || { echo "::error::APK is not signed – add the RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD secrets."; exit 1; }
            if "$aapt2" dump badging "$apk" 2>/dev/null | grep -q "application-debuggable"; then
              echo "::error::Release APK is debuggable – this must never happen for a release build."
              exit 1
            fi
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "All $count release APK(s) are signed and non-debuggable."

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-release
          path: app/build/outputs/apk/release/*.apk
