
name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned Xray core
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar" -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon -PABI_FILTERS=${{ matrix.abi }}

      - name: Generate SHA-256
        run: |
          cd app/build/outputs/apk/debug
          for file in *.apk; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-debug-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
