
name: Android Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pure-Java core of the OpenVPN payload / WebSocket transport: compile + run its tests before building.
      - name: Test OpenVPN transport core
        run: |
          mkdir -p /tmp/ovpn-core
          javac -Xlint:all -d /tmp/ovpn-core app/src/main/java/com/ontunnel/app/ovpn/*.java tools/ovpn-core-test/*.java
          java -cp /tmp/ovpn-core PayloadScenarios
          java -cp /tmp/ovpn-core OvpnCoreTest

      - name: Restore fixed Debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: on-tunnel-debug-keystore-v1

      - name: Create Debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ON Tunnel Debug,O=ON Tunnel,C=US"
          fi

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar" \
            -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          yes | "$sdkmanager" --licenses || true
          "$sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM APKs (ARM-only Universal)
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon \
            -PABI_FILTERS="arm64-v8a;armeabi-v7a" \
            -PUNIVERSAL_APK=true
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-universal-debug.apk staged-apks/ON-Tunnel-Universal.apk
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk staged-apks/ON-Tunnel-arm64-v8a.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk staged-apks/ON-Tunnel-armeabi-v7a.apk

      - name: Build separate x86 APKs
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon \
            -PABI_FILTERS="x86;x86_64" \
            -PUNIVERSAL_APK=false
          cp app/build/outputs/apk/debug/app-x86-debug.apk staged-apks/ON-Tunnel-x86.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk staged-apks/ON-Tunnel-x86_64.apk

      - name: Verify APK files and architectures
        shell: bash
        run: |
          set -euo pipefail

          universal="staged-apks/ON-Tunnel-Universal.apk"
          x86_apk="staged-apks/ON-Tunnel-x86.apk"
          x86_64_apk="staged-apks/ON-Tunnel-x86_64.apk"

          for apk in "$universal" "$x86_apk" "$x86_64_apk"; do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected APK: $apk"
              ls -lah staged-apks/
              exit 1
            fi
            unzip -t "$apk"
          done

          entries="$(unzip -Z1 "$universal")"
          grep -q '^lib/arm64-v8a/.*\.so
      - name: Verify signatures
        shell: bash
        run: |
          set -euo pipefail

          expected="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          count=0

          for apk in staged-apks/*.apk; do
            [ -f "$apk" ] || continue

            echo "Checking: $apk"

            unzip -t "$apk" >/dev/null

            output="$("$apksigner" verify --print-certs "$apk")"
            echo "$output"

            actual="$(echo "$output" |
              awk '/certificate SHA-256 digest:/ {print $NF; exit}' |
              tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Invalid APK signature."
              exit 1
            fi

            count=$((count + 1))
          done

          test "$count" -gt 0
          echo "All APK files passed verification."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-All-ABIs
          path: staged-apks/*.apk
          if-no-files-found: error

      - name: Prepare GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p release
          cp staged-apks/*.apk release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ON Tunnel ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
 <<< "$entries" || { echo "::error::arm64-v8a missing from Universal."; exit 1; }
          grep -q '^lib/armeabi-v7a/.*\.so
      - name: Verify signatures
        shell: bash
        run: |
          set -euo pipefail

          expected="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          count=0

          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue

            echo "Checking: $apk"

            unzip -t "$apk" >/dev/null

            output="$("$apksigner" verify --print-certs "$apk")"
            echo "$output"

            actual="$(echo "$output" |
              awk '/certificate SHA-256 digest:/ {print $NF; exit}' |
              tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Invalid APK signature."
              exit 1
            fi

            count=$((count + 1))
          done

          test "$count" -gt 0
          echo "All APK files passed verification."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-ARM
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p release

          cp app/build/outputs/apk/debug/app-universal-debug.apk \
             release/ON-Tunnel-Universal.apk

          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             release/ON-Tunnel-arm64-v8a.apk

          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             release/ON-Tunnel-armeabi-v7a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ON Tunnel ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
 <<< "$entries" || { echo "::error::armeabi-v7a missing from Universal."; exit 1; }
          if grep -Eq '^lib/(x86|x86_64)/' <<< "$entries"; then
            echo "::error::Universal APK must remain ARM-only."
            exit 1
          fi

          x86_entries="$(unzip -Z1 "$x86_apk")"
          grep -q '^lib/x86/.*\.so
      - name: Verify signatures
        shell: bash
        run: |
          set -euo pipefail

          expected="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          count=0

          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue

            echo "Checking: $apk"

            unzip -t "$apk" >/dev/null

            output="$("$apksigner" verify --print-certs "$apk")"
            echo "$output"

            actual="$(echo "$output" |
              awk '/certificate SHA-256 digest:/ {print $NF; exit}' |
              tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Invalid APK signature."
              exit 1
            fi

            count=$((count + 1))
          done

          test "$count" -gt 0
          echo "All APK files passed verification."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-ARM
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p release

          cp app/build/outputs/apk/debug/app-universal-debug.apk \
             release/ON-Tunnel-Universal.apk

          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             release/ON-Tunnel-arm64-v8a.apk

          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             release/ON-Tunnel-armeabi-v7a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ON Tunnel ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
 <<< "$x86_entries" || { echo "::error::x86 libraries missing."; exit 1; }
          if grep -Eq '^lib/(arm64-v8a|armeabi-v7a|x86_64)/' <<< "$x86_entries"; then
            echo "::error::Unexpected ABI found in x86 APK."
            exit 1
          fi

          x86_64_entries="$(unzip -Z1 "$x86_64_apk")"
          grep -q '^lib/x86_64/.*\.so
      - name: Verify signatures
        shell: bash
        run: |
          set -euo pipefail

          expected="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          count=0

          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue

            echo "Checking: $apk"

            unzip -t "$apk" >/dev/null

            output="$("$apksigner" verify --print-certs "$apk")"
            echo "$output"

            actual="$(echo "$output" |
              awk '/certificate SHA-256 digest:/ {print $NF; exit}' |
              tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Invalid APK signature."
              exit 1
            fi

            count=$((count + 1))
          done

          test "$count" -gt 0
          echo "All APK files passed verification."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-ARM
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p release

          cp app/build/outputs/apk/debug/app-universal-debug.apk \
             release/ON-Tunnel-Universal.apk

          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             release/ON-Tunnel-arm64-v8a.apk

          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             release/ON-Tunnel-armeabi-v7a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ON Tunnel ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
 <<< "$x86_64_entries" || { echo "::error::x86_64 libraries missing."; exit 1; }
          if grep -Eq '^lib/(arm64-v8a|armeabi-v7a|x86)/' <<< "$x86_64_entries"; then
            echo "::error::Unexpected ABI found in x86_64 APK."
            exit 1
          fi

          echo "Universal remains ARM-only; x86 and x86_64 APKs are separate."

      - name: Verify signatures
        shell: bash
        run: |
          set -euo pipefail

          expected="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          count=0

          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue

            echo "Checking: $apk"

            unzip -t "$apk" >/dev/null

            output="$("$apksigner" verify --print-certs "$apk")"
            echo "$output"

            actual="$(echo "$output" |
              awk '/certificate SHA-256 digest:/ {print $NF; exit}' |
              tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Invalid APK signature."
              exit 1
            fi

            count=$((count + 1))
          done

          test "$count" -gt 0
          echo "All APK files passed verification."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-ARM
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p release

          cp app/build/outputs/apk/debug/app-universal-debug.apk \
             release/ON-Tunnel-Universal.apk

          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             release/ON-Tunnel-arm64-v8a.apk

          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             release/ON-Tunnel-armeabi-v7a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ON Tunnel ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
