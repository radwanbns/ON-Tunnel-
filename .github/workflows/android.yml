name: Android Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    # Signing secrets are only available to trusted push/manual runs, not pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.p12
          test -s release-keystore.p12
      - name: Download pinned Xray core
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar" -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle assembleRelease --no-daemon -PABI_FILTERS=${{ matrix.abi }}
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-release-${{ matrix.abi }}
          path: app/build/outputs/apk/release/*.apk
