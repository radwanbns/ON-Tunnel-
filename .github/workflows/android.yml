name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Reuse the same debug signing key between workflow runs.
      - name: Restore fixed Debug keystore
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: on-tunnel-debug-keystore-v1

      - name: Create Debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ON Tunnel Debug,O=ON Tunnel,C=US"
          fi

      - name: Show fixed signing certificate
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep "SHA256:"

      - name: Download pinned Xray core
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar" \
            -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build all ABI APKs with the fixed signing key
        run: gradle assembleDebug --no-daemon

      - name: Verify the signature of every APK
        shell: bash
        run: |
          set -euo pipefail
          expected="$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$expected"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          count=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            test -f "$apk"
            echo "=== $(basename "$apk") ==="
            cert_output="$("$apksigner" verify --print-certs "$apk")"
            echo "$cert_output"
            actual="$(printf '%s\\n' "$cert_output" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            echo "APK certificate SHA-256: $actual"
            if [ -z "$actual" ]; then
              echo "::error::Could not extract APK signing certificate SHA-256."
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::APK signing certificate does not match the fixed Debug keystore."
              exit 1
            fi
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "All $count APK files use the same fixed signing certificate."

      - name: Upload all ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: ON-Tunnel-all
          path: app/build/outputs/apk/debug/*.apk
